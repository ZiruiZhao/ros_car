<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>银行营业厅 · 服务机器人</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
  background: #f5f5f7;
  color: #1d1d1f;
  min-height: 100vh;
  padding: 40px 20px;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 680px; margin: 0 auto; }
header { text-align: center; margin-bottom: 32px; }
h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; }
.sub { font-size: 15px; color: #86868b; margin-top: 6px; }
.card {
  background: rgba(255,255,255,0.8);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-radius: 20px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.06);
  padding: 24px;
  margin-bottom: 20px;
}
.status-pill {
  display: inline-block; padding: 7px 16px; border-radius: 980px;
  font-size: 14px; background: #e8f7ee; color: #1d7a3f;
  margin-bottom: 16px;
}
#map {
  width: 100%; border-radius: 14px; cursor: crosshair;
  background: #ddd; display: block;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);
}
.btns { display: flex; gap: 12px; flex-wrap: wrap; }
button {
  border: none; border-radius: 980px; padding: 13px 28px;
  font-size: 16px; font-weight: 600; cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.2s;
}
button:active { transform: scale(0.96); }
#cruiseBtn { background: #0071e3; color: #fff; box-shadow: 0 4px 14px rgba(0,113,227,0.3); }
#cruiseBtn:hover { box-shadow: 0 6px 20px rgba(0,113,227,0.4); }
#stopBtn { background: #ff3b30; color: #fff; box-shadow: 0 4px 14px rgba(255,59,48,0.25); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 18px; font-size: 13px; color: #6e6e73; }
.chip { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
.dot.wall { background: #111; }
.dot.free { background: #fafafa; box-shadow: inset 0 0 0 1px #ccc; }
.dot.unknown { background: #b9b9b9; }
.dot.wp { background: #00c853; }
.dot.robot { background: #0071e3; }
.line { width: 18px; height: 3px; border-radius: 2px; display: inline-block; }
.line.global { background: #00a843; }
.line.local { background: #ff3b30; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>银行营业厅 · 服务机器人</h1>
    <div class="sub">休息区 · 储蓄业务区 · 信贷业务区 三航点巡航</div>
  </header>

  <div class="card">
    <div class="status-pill" id="status">地图加载中…</div>
    <canvas id="map" width="512" height="512"></canvas>
  </div>

  <div class="card">
    <div class="btns">
      <button id="cruiseBtn">开始巡航 A → B → C</button>
      <button id="stopBtn">停止</button>
    </div>
    <div class="legend">
      <span class="chip"><span class="dot wall"></span>墙</span>
      <span class="chip"><span class="dot free"></span>可走区域</span>
      <span class="chip"><span class="dot unknown"></span>未知</span>
      <span class="chip"><span class="dot wp"></span>航点</span>
      <span class="chip"><span class="dot robot"></span>机器人</span>
      <span class="chip"><span class="line global"></span>全局规划</span>
      <span class="chip"><span class="line local"></span>局部规划</span>
      <span class="chip">✛ 按住地图拖出方向 = 标注初始位姿</span>
    </div>
  </div>
</div>
<script>
const W = 408, H = 384;
const RES = 0.05, OX = -11.4, OY = -0.7;
const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');
const scale = canvas.width / W;
let waypoints = [], robot = null, baseMap = null;
let globalPlan = [], localPlan = [], dragStart = null, initYaw = 0;

function px2map(px, py) { return [OX + px * RES, OY + (H - py) * RES]; }
function map2px(mx, my) { return [mx / RES - OX / RES, H - (my / RES - OY / RES)]; }

fetch('/map.pgm').then(r => r.arrayBuffer()).then(buf => {
  const b = new Uint8Array(buf);
  let i = 0;
  while (b[i] !== 0x0A) i++; i++;
  while (b[i] === 35) { while (b[i] !== 0x0A) i++; i++; }
  let s = '';
  while (b[i] !== 0x20) s += String.fromCharCode(b[i++]); i++;
  const w = parseInt(s); s = '';
  while (b[i] !== 0x0A) s += String.fromCharCode(b[i++]); i++;
  const h = parseInt(s);
  while (b[i] !== 0x0A) i++; i++;
  const img = ctx.createImageData(w, h);
  for (let p = 0; p < w * h; p++) {
    const v = b[i + p];
    const g = (v <= 100) ? 0 : (v >= 250 ? 255 : 205);
    img.data[p * 4] = g; img.data[p * 4 + 1] = g; img.data[p * 4 + 2] = g; img.data[p * 4 + 3] = 255;
  }
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  off.getContext('2d').putImageData(img, 0, 0);
  baseMap = off;
  document.getElementById('status').textContent = '地图就绪 · 按住地图拖出小车位置与朝向';
  draw();
});

function drawPlans(plan, color, width) {
  if (plan.length < 2) return;
  ctx.strokeStyle = color; ctx.lineWidth = width;
  ctx.beginPath();
  plan.forEach((pt, i) => {
    const [px, py] = map2px(pt[0], pt[1]);
    if (i === 0) ctx.moveTo(px * scale, py * scale); else ctx.lineTo(px * scale, py * scale);
  });
  ctx.stroke();
}

function draw() {
  ctx.fillStyle = '#ddd'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (baseMap) ctx.drawImage(baseMap, 0, 0, canvas.width, canvas.height);
  drawPlans(globalPlan, '#00a843', 3);
  drawPlans(localPlan, '#ff3b30', 2);
  waypoints.forEach((wp, i) => {
    const [px, py] = map2px(wp[1], wp[2]);
    ctx.fillStyle = '#00c853';
    ctx.beginPath(); ctx.arc(px * scale, py * scale, 9, 0, 7); ctx.fill();
    ctx.font = 'bold 16px -apple-system, sans-serif';
    const label = String.fromCharCode(65 + i) + ' ' + wp[0];
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.fillRect(px * scale + 10, py * scale - 14, tw + 6, 20);
    ctx.fillStyle = '#1d1d1f';
    ctx.fillText(label, px * scale + 13, py * scale + 1);
  });
  if (robot) {
    const [px, py] = map2px(robot.x, robot.y);
    ctx.fillStyle = '#0071e3';
    ctx.beginPath(); ctx.arc(px * scale, py * scale, 7, 0, 7); ctx.fill();
    ctx.strokeStyle = '#0071e3'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(px * scale, py * scale);
    ctx.lineTo(px * scale + 18 * Math.cos(robot.yaw * Math.PI / 180), py * scale - 18 * Math.sin(robot.yaw * Math.PI / 180));
    ctx.stroke();
  }
  if (dragStart) {
    const [px, py] = dragStart;
    ctx.fillStyle = '#ff9500';
    ctx.beginPath(); ctx.arc(px * scale, py * scale, 8, 0, 7); ctx.fill();
    ctx.strokeStyle = '#ff9500'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(px * scale, py * scale);
    ctx.lineTo(px * scale + 30 * Math.cos(initYaw), py * scale - 30 * Math.sin(initYaw));
    ctx.stroke();
  }
}

canvas.onmousedown = (e) => {
  const rect = canvas.getBoundingClientRect();
  const k = rect.width / W;
  dragStart = [ (e.clientX - rect.left) / k, (e.clientY - rect.top) / k ];
  initYaw = 0;
  draw();
};
window.addEventListener('mousemove', (e) => {
  if (!dragStart) return;
  const rect = canvas.getBoundingClientRect();
  const k = rect.width / W;
  const dx = (e.clientX - rect.left) / k - dragStart[0];
  const dy = (e.clientY - rect.top) / k - dragStart[1];
  if (dx * dx + dy * dy > 9) initYaw = Math.atan2(-dy, dx);
  draw();
});
window.addEventListener('mouseup', (e) => {
  if (!dragStart) return;
  const rect = canvas.getBoundingClientRect();
  const k = rect.width / W;
  const dx = (e.clientX - rect.left) / k - dragStart[0];
  const dy = (e.clientY - rect.top) / k - dragStart[1];
  if (dx * dx + dy * dy > 9) initYaw = Math.atan2(-dy, dx);
  const [mx, my] = px2map(dragStart[0], dragStart[1]);
  dragStart = null;
  fetch('/initial_pose', { method: 'POST', body: JSON.stringify({ x: mx, y: my, yaw: initYaw }) })
    .then(r => r.json()).then(() => {
      document.getElementById('status').textContent = '初始位姿已设置: (' + mx.toFixed(2) + ', ' + my.toFixed(2) + ') 朝向 ' + Math.round(initYaw * 180 / Math.PI) + '°';
    });
  draw();
});

document.getElementById('cruiseBtn').onclick = () => {
  document.getElementById('status').textContent = '巡航指令已发送，机器人出发…';
  fetch('/cruise', { method: 'POST', body: '{}' });
};
document.getElementById('stopBtn').onclick = () => {
  fetch('/cancel', { method: 'POST', body: '{}' });
  document.getElementById('status').textContent = '已发送停止指令';
};

fetch('/waypoints').then(r => r.json()).then(d => { waypoints = d; draw(); });
setInterval(() => {
  fetch('/pose').then(r => r.json()).then(d => {
    if (d.x !== undefined) {
      robot = d;
      fetch('/cruise_status').then(r2 => r2.json()).then(s => {
        if (s.cruising) {
          let target = null;
          for (const w of waypoints) {
            if (Math.hypot(d.x - w[1], d.y - w[2]) > 0.3) { target = w; break; }
          }
          document.getElementById('status').textContent = target
            ? '巡航中 · 前往 ' + target[0] : '巡航中 · 即将完成';
        }
      });
      draw();
    }
  });
  fetch('/plans').then(r => r.json()).then(d => { globalPlan = d.global || []; localPlan = d.local || []; draw(); });
}, 800);
</script>
</body>
</html>
